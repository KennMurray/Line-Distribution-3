
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Distribution Studio</title>
  <style>
    body {
      background: #101018;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      color: #ff80c8;
    }

    .preview {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #050509;
      border: 2px solid #ff80c8;
      border-radius: 12px;
      margin: 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background: #ff80c8;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>LINE DISTRIBUTION STUDIO</h1>
  <p>Create your own K-pop line distribution!</p>

  <div class="preview">
    <h2>16:9 VIDEO PREVIEW</h2>
  </div>

  <button onclick="alert('It works!')">
    Test Generator
  </button>

</body>
</html>
